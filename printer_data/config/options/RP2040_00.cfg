[mcu pico]
serial: /dev/serial/by-id/usb-Klipper_rp2040_50445061086F0F1C-if00
restart_method: command
is_non_critical: true

#[temperature_sensor Chamber_Temp]
#sensor_type: Generic 3950
#sensor_pin: pico:gpio26
#pullup_resistor: 4700  # Значение подтягивающего резистора в Омах (обычно 4.7 кОм)

[filament_switch_sensor filament_sensor]
switch_pin: PE9
pause_on_runout: False
runout_gcode:
  # Запускаем отсчет 400 мм только если принтер сейчас печатает (чтобы не срабатывало при ручной выгрузке)
  {% if printer.print_stats.state == "printing" %}
    M117 Filament end! 400mm left...
    # Отключаем энкодер, чтобы он не вызвал мгновенную паузу
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
    # Запоминаем текущее значение потраченного пластика в переменную макроса
    SET_GCODE_VARIABLE MACRO=_FILAMENT_RUNOUT_TRACKER VARIABLE=start_used VALUE={printer.print_stats.filament_used}
    # Запускаем фоновую проверку каждые 0.5 секунды
    UPDATE_DELAYED_GCODE ID=delayed_filament_pause DURATION=0.5
  {% endif %}
insert_gcode:
  M117 Filament switch inserted
  # Останавливаем таймер отложенной паузы, если новый пруток вставили раньше, чем прошли 400 мм
  UPDATE_DELAYED_GCODE ID=delayed_filament_pause DURATION=0
  # Включаем энкодер обратно
  SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1

# Вспомогательный макрос для хранения точки отсчета (в мм)
[gcode_macro _FILAMENT_RUNOUT_TRACKER]
variable_start_used: 0.0
gcode:

# Фоновый цикл, который следит за выдавливанием 400 мм
[delayed_gcode delayed_filament_pause]
initial_duration: 0
gcode:
  # Останавливаем цикл, если печать уже поставлена на паузу, отменена или завершена
  {% if printer.print_stats.state != "printing" %}
    UPDATE_DELAYED_GCODE ID=delayed_filament_pause DURATION=0
  {% else %}
    {% set start_used = printer["gcode_macro _FILAMENT_RUNOUT_TRACKER"].start_used %}
    {% set current_used = printer.print_stats.filament_used %}
    {% set extruded = current_used - start_used %}
    
    {% if extruded >= 400.0 %}
      M117 400mm extruded! Pausing...
      PAUSE
    {% else %}
      # Повторяем проверку через 0.5 секунды
      UPDATE_DELAYED_GCODE ID=delayed_filament_pause DURATION=0.5
    {% endif %}
  {% endif %}

[filament_motion_sensor encoder_sensor]
switch_pin: ^pico:gpio29
detection_length: 7.0
extruder: extruder
pause_on_runout: False
runout_gcode:
  FILAMENT_RUNOUT
insert_gcode:
  M117 Filament encoder inserted


[gcode_macro FILAMENT_RUNOUT]
gcode:
  {% if printer.print_stats.state == "printing" %}
    PAUSE
    M117 Филамент остановился!
  {% else %}
    M117 Игнорируем пропуск филамента
  {% endif %}

[temperature_fan chamber_fan]
pin: PA6
cycle_time: 0.0100
hardware_pwm: false
max_power: 1
shutdown_speed: 0
sensor_type: Generic 3950
sensor_pin: pico:gpio26
min_temp: 0
max_temp: 70
control: watermark
max_delta: 2
target_temp: 35.0
max_speed: 1.0
min_speed: 0.0

[gcode_macro TOGGLE_PAUSE]
description: "Toggle pause/resume print"
gcode:
    {% if printer.print_stats.state == "printing" %}
        PAUSE
    {% elif printer.print_stats.state == "paused" %}
        RESUME
    {% else %}
        M117 No print to control
    {% endif %}

[gcode_button button1]
pin: ^!pico:gpio2
press_gcode: TOGGLE_PAUSE

[gcode_button button2]
pin: ^!pico:gpio3
press_gcode: 
    {% if printer.idle_timeout.state != 'Printing' or printer.pause_resume.is_paused %}  ; unload if not printing OR printing but paused
      UNLOAD_FILAMENT
    {% endif %}

[gcode_button button3]
pin: ^!pico:gpio4
press_gcode: 
    {% if printer.idle_timeout.state != 'Printing' or printer.pause_resume.is_paused %}  ; unload if not printing OR printing but paused
      LOAD_FILAMENT
    {% endif %}

[temperature_sensor Pico_Temp]
sensor_type: temperature_mcu
sensor_mcu: pico