[probe]
pin: extra_mcu:PB9
x_offset: 0
y_offset: 26.66
# z_offset: 2.9
# You can find the z_offset option in the printer.cfg
z_offset : 0
speed: 5.0
samples: 2
sample_retract_dist: 2.0
lift_speed: 50
samples_result: average
samples_tolerance: 0.016
samples_tolerance_retries: 2

# [z_calibration]
# nozzle_xy_position: 293,335   #<X,Y position for clicking the nozzle on the z endstop - not needed if [safe_z_home] is used>
# #switch_xy_offsets:    <X,Y offsets from the nozzle position for clicking the probe's switch body on the z endstop>
# #bed_xy_position:      <X,Y position for probing the bed, for instance the center point - not needed if mesh with zero_reference_position is used>
# #switch_offset:        <offset of the switch trigger (read the Switch Offset section!)>
# start_gcode: Attach_Probe         <macro name for attaching the probe>
# #before_switch_gcode: <macro name for attaching the probe AFTER probing the nozzle>
# end_gcode: Dock_Probe           <macro name for docking the probe>

# [z_offset_calibration]
#  center_xy_position:191,165
#  endstop_xy_position:293,335
#  z_hop: 10
#  z_hop_speed: 15



[bed_mesh]
zero_reference_position: 177.5, 178    
speed: 450
horizontal_move_z: 3
mesh_min: 20, 30
mesh_max: 330, 330
probe_count: 6, 6
algorithm: bicubic
adaptive_margin: 10
fade_start: 1.0
fade_end: 5.0
fade_target: 0



# [homing_override]
# gcode:
#   LED_BLUE
#   # Move 5 up, just in case (this is our safety zhop, this needs 'set_position_z: 0' below)
#   G91 ; set relative positioning
#   G0 Z10 F2000 ; 10 up zhop
#   {% if not rawparams or 'X' in rawparams %}
#     {action_respond_info('Homing X')}
#     G28 X
#     G90 ; set absolute positioning
#     G0 X177.5 F12000 ; return to center
#     M400 ; Wait for move to finish
#   {% endif %}
#   {% if not rawparams or 'Y' in rawparams %}
#     {action_respond_info('Homing Y')}
#     G28 Y
#     G90 ; set absolute positioning
#     G0 Y154.1 F12000 ; return to center
#     M400 ; Wait for move to finish
#   {% endif %}
#   {% if not rawparams or 'Z' in rawparams %}
#     {action_respond_info('Homing Z')}
#     G90 ; set absolute positioning
#     G0 X177.5 Y154.1 F12000 ; return to center, please add your offsets manually if you want to
#     G28 Z
#     G91 ; set relative positioning
#     G0 Z5 F2000 ; 5mm up
#     M400 ; Wait for move to finish
#   {% endif %}
#   G90 ; set absolute positioning
#   LED_GREEN
# axes: xyz
# set_position_z: 0 # This forces the z position to be at 0 when we start homing, so we can move the Z up before homing.
