[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_32FFDA054747363011781057-if00
restart_method: command    

[mcu extra_mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_040026000F504B5735313720-if00
restart_method: command      

[printer]
kinematics: corexy           
max_velocity: 700            
max_accel: 15000             
minimum_cruise_ratio: 0.5
max_z_velocity: 50           
max_z_accel: 1000             
square_corner_velocity: 10.0 

[screws_tilt_adjust]
screw1: 175, 150
screw1_name: 2-2
screw2: 20,5
screw2_name: 1-1
#screw3: 20, 150
#screw3_name: 1-2
screw3: 20, 310
screw3_name: 1-3
#screw5: 175, 310
#screw5_name: 2-3
screw4: 330, 310
screw4_name: 3-3
#screw7: 330, 150
#screw7_name: 3-2
screw5: 330, 5
screw5_name: 3-1
#screw9: 175, 5
#screw9_name: 2-1
speed: 400
#   The speed (in mm/s) of non-probing moves during the calibration.
#   The default is 50.
horizontal_move_z: 5
#   The height (in mm) that the head should be commanded to move to
#   just prior to starting a probe operation. The default is 5.
screw_thread: CW-M4
#   The type of screw used for bed leveling, M3, M4, or M5, and the
#   rotation direction of the knob that is used to level the bed.
#   Accepted values: CW-M3, CCW-M3, CW-M4, CCW-M4, CW-M5, CCW-M5.
#   Default value is CW-M3 which most printers use. A clockwise
#   rotation of the knob decreases the gap between the nozzle and the
#   bed. Conversely, a counter-clockwise rotation increases the gap.

[duplicate_pin_override]
pins: extra_mcu:PA3

[z_thermal_adjust]
temp_coeff: 0 #-0.00042
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: extra_mcu:PA3
min_temp: 5                  
max_temp: 305



[stepper_x]
step_pin: PE2
dir_pin: !PE0
enable_pin: !PE3
rotation_distance: 40         
microsteps: 32                
full_steps_per_rotation:200   
endstop_pin: tmc2209_stepper_x: virtual_endstop              
position_min: 0               
#position_endstop: 354 Паралелные каретки     
#position_max: 354             
position_endstop: 362         
position_max: 362  

homing_speed: 50              
homing_retract_dist: 0        
homing_positive_dir: True   
high_precision_step_compress: True  
#--------------------------------------------------------------------
[tmc2209 stepper_x]
uart_pin: PE1
interpolate: True           
run_current: 1.3              
##hold_current: 1.1             
sense_resistor: 0.150         
stealthchop_threshold: 0      
uart_address:3
driver_sgthrs: 95
diag_pin: PE15

#chopper_tune
#driver_TBL: 3
#driver_TOFF: 9
#driver_HSTRT: 3
#driver_HEND: 3

#chopper_tune Ledshine
driver_TBL: 3
driver_TOFF: 1
driver_HSTRT: 3
driver_HEND: 2

#с мотора
#chopper_tune
#driver_TBL: 3
#driver_TOFF: 3
#driver_HSTRT: 0
#driver_HEND: 2

